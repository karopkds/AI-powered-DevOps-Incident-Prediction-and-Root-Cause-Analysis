grafana:
  enabled: true
  persistence:
    enabled: false

prometheus:
  prometheusSpec:
    retention: 2d
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
    storageSpec:
      emptyDir: {}

alertmanager:
  enabled: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false