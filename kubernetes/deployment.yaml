apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-app 
spec:
  replicas: 1

  selector:
    matchLabels:
      app: aiops-app

  template:
    metadata:
      labels:
        app: aiops-app

    spec:
      containers:
        - name: aiops-app
          image: aiops-incident-prediction:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 5000